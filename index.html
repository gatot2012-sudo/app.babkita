<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BabKita App – Satu Bab, Sejuta Cerita</title>
  <script src="https://tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cloudflare.com" />
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20 md:pb-10">

  <!-- HEADER / NAVBAR -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <!-- Logo -->
      <div onclick="showView('home')" class="flex items-center gap-2 cursor-pointer">
        <div class="w-9 h-9 rounded-lg bg-red-600 text-white flex items-center justify-center font-bold text-xl shadow">B</div>
        <div>
          <span class="font-extrabold text-xl tracking-tight text-slate-900">Bab<span class="text-red-600">Kita</span></span>
          <span class="hidden sm:block text-[10px] text-slate-500 -mt-1">Satu Bab, Sejuta Cerita</span>
        </div>
      </div>

      <!-- Pencarian -->
      <div class="flex-1 max-w-md">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" onkeyup="filterBooks()" placeholder="Cari judul buku atau penulis..."
            class="w-full pl-9 pr-4 py-2 text-sm bg-slate-100 rounded-full focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition" />
        </div>
      </div>

      <!-- Tombol Aksi -->
      <div class="flex items-center gap-2">
        <button onclick="openWriteModal()" class="bg-red-600 hover:bg-red-700 text-white text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-full flex items-center gap-1.5 shadow-sm transition">
          <i class="fa-solid fa-pen-nib"></i>
          <span class="hidden sm:inline">Menulis</span>
        </button>
        <button id="authBtn" onclick="toggleAuthModal()" class="border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-full transition">
          Masuk / Daftar
        </button>
      </div>
    </div>

    <!-- Navigasi Kategori -->
    <nav class="bg-white border-t border-slate-100">
      <div id="categoryNav" class="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-2 overflow-x-auto no-scrollbar text-xs font-medium">
        <!-- Kategori diisi lewat JS -->
      </div>
    </nav>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="max-w-6xl mx-auto px-4 pt-6">

    <!-- 1. TAMPILAN BERANDA -->
    <section id="homeView">
      <!-- Banner Info -->
      <div class="bg-gradient-to-r from-red-600 to-rose-700 rounded-2xl p-5 sm:p-7 text-white mb-8 shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <span class="bg-white/20 text-xs px-2.5 py-1 rounded-full font-semibold">Aplikasi Resmi BabKita.com</span>
          <h1 class="text-xl sm:text-2xl font-bold mt-2">Baca & Terbitkan Ceritamu Bab Demi Bab</h1>
          <p class="text-red-100 text-xs sm:text-sm mt-1">Temukan ribuan novel pilihan atau mulai tulis bukumu sendiri hari ini.</p>
        </div>
        <button onclick="openWriteModal()" class="bg-white text-red-600 hover:bg-red-50 font-bold text-xs sm:text-sm px-5 py-2.5 rounded-full shadow shrink-0 transition">
          + Terbitkan Buku
        </button>
      </div>

      <!-- Rak Buku Terbaru -->
      <div class="mb-10">
        <div class="flex items-center justify-between mb-4">
          <h2 id="shelfTitle" class="text-lg sm:text-xl font-bold text-slate-900 flex items-center gap-2">
            <span class="w-1.5 h-6 bg-red-600 rounded-full"></span> Buku Terbaru
          </h2>
          <span id="bookCount" class="text-xs text-slate-500"></span>
        </div>
        <div id="booksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-5">
          <!-- Kartu Buku diisi lewat JS -->
        </div>
      </div>

      <!-- Rak Per Kategori Pilihan -->
      <div id="categoryShelves" class="space-y-10"></div>
    </section>

    <!-- 2. TAMPILAN DETAIL BUKU -->
    <section id="detailView" class="hidden">
      <button onclick="showView('home')" class="mb-4 text-sm text-slate-600 hover:text-red-600 font-medium flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
      </button>

      <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-7 shadow-sm">
        <div class="flex flex-col sm:flex-row gap-6">
          <img id="detailCover" src="" alt="Cover" class="w-40 sm:w-48 h-60 sm:h-72 object-cover rounded-xl shadow-md mx-auto sm:mx-0" />
          <div class="flex-1">
            <div class="flex flex-wrap items-center gap-2 mb-2">
              <span id="detailCategory" class="bg-red-50 text-red-600 text-xs font-bold px-3 py-1 rounded-full"></span>
              <span id="detailStatus" class="bg-emerald-50 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full"></span>
            </div>
            <h1 id="detailTitle" class="text-2xl sm:text-3xl font-extrabold text-slate-900"></h1>
            <p class="text-sm text-slate-500 mt-1">Oleh <span id="detailAuthor" class="font-semibold text-slate-800"></span></p>

            <!-- Statistik -->
            <div class="grid grid-cols-4 gap-2 max-w-md my-4 p-3 bg-slate-50 rounded-xl border border-slate-100 text-center">
              <div>
                <div class="text-xs text-slate-400"><i class="fa-solid fa-eye text-blue-500"></i> Pembaca</div>
                <div id="detailViews" class="font-bold text-sm sm:text-base text-slate-800">0</div>
              </div>
              <div>
                <div class="text-xs text-slate-400"><i class="fa-solid fa-book-open text-amber-500"></i> Bab</div>
                <div id="detailChaptersCount" class="font-bold text-sm sm:text-base text-slate-800">0</div>
              </div>
              <div>
                <div class="text-xs text-slate-400"><i class="fa-solid fa-bell text-red-500"></i> Subscribe</div>
                <div id="detailSubs" class="font-bold text-sm sm:text-base text-slate-800">0</div>
              </div>
              <div>
                <div class="text-xs text-slate-400"><i class="fa-solid fa-comment text-emerald-500"></i> Komentar</div>
                <div id="detailCommentsCount" class="font-bold text-sm sm:text-base text-slate-800">0</div>
              </div>
            </div>

            <p id="detailSynopsis" class="text-sm text-slate-600 leading-relaxed mb-5"></p>

            <div class="flex flex-wrap gap-3">
              <button onclick="readChapter(0)" class="bg-red-600 hover:bg-red-700 text-white font-semibold text-sm px-6 py-2.5 rounded-full shadow transition">
                <i class="fa-solid fa-book-open mr-1"></i> Mulai Baca
              </button>
              <button id="subBtn" onclick="toggleSubscribe()" class="border border-red-600 text-red-600 hover:bg-red-50 font-semibold text-sm px-5 py-2.5 rounded-full transition">
                <i class="fa-regular fa-bell mr-1"></i> Subscribe
              </button>
              <button onclick="openAddChapterModal()" class="border border-slate-300 hover:bg-slate-100 text-slate-700 font-semibold text-sm px-5 py-2.5 rounded-full transition">
                + Tambah Bab
              </button>
            </div>
          </div>
        </div>

        <!-- Daftar Bab -->
        <div class="mt-8 pt-6 border-t border-slate-100">
          <h3 class="font-bold text-base text-slate-900 mb-3">Daftar Bab</h3>
          <div id="chapterList" class="divide-y divide-slate-100 border border-slate-200 rounded-xl overflow-hidden"></div>
        </div>
      </div>
    </section>

    <!-- 3. TAMPILAN RUANG BACA (READER MODE) -->
    <section id="readerView" class="hidden max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-4 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <button onclick="showView('detail')" class="text-sm font-medium text-slate-600 hover:text-red-600 flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i> Daftar Bab
        </button>
        <!-- Pengaturan Tema & Font -->
        <div class="flex items-center gap-2">
          <button onclick="changeFontSize(-1)" class="w-8 h-8 rounded-lg border border-slate-200 text-xs font-bold hover:bg-slate-100">A-</button>
          <button onclick="changeFontSize(1)" class="w-8 h-8 rounded-lg border border-slate-200 text-xs font-bold hover:bg-slate-100">A+</button>
          <button onclick="setReaderTheme('light')" class="w-6 h-6 rounded-full bg-white border border-slate-400" title="Terang"></button>
          <button onclick="setReaderTheme('sepia')" class="w-6 h-6 rounded-full bg-amber-100 border border-amber-400" title="Sepia"></button>
          <button onclick="setReaderTheme('dark')" class="w-6 h-6 rounded-full bg-slate-900 border border-slate-600" title="Gelap"></button>
        </div>
      </div>

      <article id="readerContainer" class="bg-white text-slate-800 rounded-2xl border border-slate-200 p-6 sm:p-10 shadow-sm transition-colors">
        <p id="readerBookTitle" class="text-xs font-bold text-red-600 uppercase tracking-wider"></p>
        <h1 id="readerChapterTitle" class="text-xl sm:text-2xl font-extrabold mt-1 mb-6"></h1>
        <div id="readerContent" class="leading-relaxed space-y-4 text-base"></div>
      </article>

      <!-- Navigasi Bab -->
      <div class="flex items-center justify-between my-6">
