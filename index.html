<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BabKita App – Satu Bab, Sejuta Cerita</title>
  <style>
  :root {
    --amber: #f59e0b;
    --amber-dark: #d97706;
    --amber-light: #fef3c7;
    --bg: #fdfbf7;
    --text: #1e293b;
    --muted: #64748b;
    --border: #fde68a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
    overflow-x: clip;
  }

  /* ===== HEADER & NAVBAR ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid var(--border);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .04);
  }

  .nav-top {
    max-width: 1240px;
    margin: auto;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-weight: 800;
    font-size: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .logo-box {
    width: 36px;
    height: 36px;
    background: var(--amber);
    color: #000;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
  }

  .logo span { color: var(--amber-dark); }

  .search-box {
    flex: 1;
    max-width: 440px;
    min-width: 0;
  }

  .search-box input {
    width: 100%;
    padding: 9px 16px;
    border-radius: 99px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    font-size: 13px;
    transition: border-color .2s, box-shadow .2s;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--amber);
    background: #fff;
    box-shadow: 0 0 0 3px var(--amber-light);
  }

  /* Tombol tidak pernah wrap jadi lingkaran besar */
  .btn {
    padding: 8px 15px;
    border-radius: 99px;
    border: none;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: transform .15s, opacity .15s;
  }

  .btn:hover { transform: translateY(-1px); opacity: .94; }
  .btn-amber { background: var(--amber); color: #000; }
  .btn-dark { background: #0f172a; color: #fcd34d; }
  .btn-outline { background: #fff; border: 1px solid #cbd5e1; color: var(--text); }

  /* Perbaikan khusus Header di HP: Search turun ke baris 2 penuh */
  @media (max-width: 767px) {
    .nav-top {
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
    }
    .logo { font-size: 18px; margin-right: auto; }
    .search-box {
      order: 3;
      flex: 0 0 100%;
      max-width: 100%;
    }
    .btn { padding: 7px 12px; font-size: 12px; }
    .btn-dark {
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  }

  /* ===== KATEGORI BAR (TANPA SCROLLBAR ABU-ABU) ===== */
  .cat-bar {
    background: #fffbeb;
    border-top: 1px solid var(--border);
    overflow-x: auto;
    white-space: nowrap;
    padding: 10px 16px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
  }
  .cat-bar::-webkit-scrollbar { display: none; }

  .cat-inner {
    max-width: 1240px;
    margin: auto;
    display: flex;
    gap: 8px;
  }

  .cat-pill {
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition: all .2s;
  }

  .cat-pill:hover { border-color: var(--amber-dark); background: var(--amber-light); }
  .cat-pill.active {
    background: var(--amber);
    color: #000;
    border-color: var(--amber-dark);
    box-shadow: 0 2px 6px rgba(245, 158, 11, .28);
  }

  /* ===== MAIN CONTAINER ===== */
  main {
    max-width: 1240px;
    margin: auto;
    padding: 16px 16px 24px;
  }

  .hero {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    padding: 28px;
    border-radius: 18px;
    margin-bottom: 28px;
    color: #0f172a;
  }
  .hero h1 { font-size: 24px; margin: 8px 0; font-weight: 800; }

  /* ===== BANNER FULL 1 LAYAR (TIDAK MENGINTIP DI LAPTOP & HP) ===== */
  .banner-wrap {
    position: relative;
    width: 100%;
    margin-bottom: 28px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(15, 23, 42, .12);
    background: #0f172a;
  }

  .banner-carousel {
    display: flex;
    width: 100%;
    gap: 0; /* WAJIB 0 agar banner berikutnya tidak mengintip */
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .banner-carousel::-webkit-scrollbar { display: none; }

  .banner-slide {
    flex: 0 0 100%;    /* WAJIB 100% di HP maupun Laptop */
    width: 100%;
    max-width: 100%;   /* Hapus batas 520px & 48% sebelumnya */
    scroll-snap-align: start;
    aspect-ratio: 12 / 5;
    cursor: pointer;
    background: #1e293b;
  }

  .banner-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Tombol navigasi panah & dots banner */
  .banner-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .35);
    background: rgba(15, 23, 42, .45);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s;
  }
  .banner-nav:hover { background: rgba(15, 23, 42, .8); }
  .banner-nav.prev { left: 12px; }
  .banner-nav.next { right: 12px; }

  @media (max-width: 767px) {
    .banner-wrap { border-radius: 12px; margin-bottom: 22px; }
    .banner-nav { display: none; } /* Di HP cukup swipe jari */
  }

  .banner-dots {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 5;
  }

  .banner-dot {
    width: 8px;
    height: 8px;
    border-radius: 99px;
    background: rgba(255, 255, 255, .55);
    border: none;
    cursor: pointer;
    transition: all .25s;
  }
  .banner-dot.active {
    width: 24px;
    background: var(--amber);
  }

  /* ===== SECTION & GRID BUKU RESPONSIF ===== */
  .section-title {
    font-size: 19px;
    font-weight: 800;
    margin: 24px 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: "";
    width: 5px;
    height: 22px;
    background: var(--amber);
    border-radius: 4px;
  }

  /* Grid rapi: 2 kolom di HP, 4-5 kolom di Laptop */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
  }
  @media (min-width: 1100px) {
    .grid { grid-template-columns: repeat(5, 1fr); gap: 18px; }
  }

  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s, border-color .2s, box-shadow .2s;
    display: flex;
    flex-direction: column;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--amber);
    box-shadow: 0 10px 22px rgba(0, 0, 0, .07);
  }

  .card-cover {
    position: relative;
    aspect-ratio: 2 / 3;
    background: #e2e8f0;
    overflow: hidden;
  }

  .card-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Badge tidak terpotong di tepi kanan kartu */
  .badge-cat {
    position: absolute;
    top: 8px;
    left: 8px;
    max-width: calc(100% - 16px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: rgba(15, 23, 42, .82);
    backdrop-filter: blur(4px);
    color: #fcd34d;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .card-body {
    padding: 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-author {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid #f1f5f9;
    padding-top: 8px;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
  }

  .hidden { display: none !important; }

/* ===== MODAL DAN FORMULIR BABKITA ===== */
.modal {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(15, 23, 42, .58);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.modal.hidden {
  display: none !important;
}

.modal-box {
  width: min(100%, 680px);
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  background: #fff;
  border: 1px solid #fde68a;
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(15,23,42,.25);
  padding: 22px;
  margin: auto;
}

.modal-box h3 {
  font-size: 18px;
  line-height: 1.35;
  color: #1e293b;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 16px;
  min-width: 0;
}

.form-group label {
  font-size: 13px;
  font-weight: 700;
  color: #334155;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  min-width: 0;
  padding: 12px 13px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  background: #fff;
  color: #1e293b;
  font: inherit;
  font-size: 14px;
  box-sizing: border-box;
}

.form-group textarea {
  min-height: 220px;
  resize: vertical;
  line-height: 1.7;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #f59e0b;
  box-shadow: 0 0 0 3px #fef3c7;
}

.panel {
  background: #fff;
  border: 1px solid #fde68a;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 6px 20px rgba(15,23,42,.05);
}

.detail-head {
  display: flex;
  gap: 22px;
  align-items: flex-start;
}

#dCover {
  width: 160px;
  max-width: 38%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 6px 16px rgba(0,0,0,.12);
}

.reader-box {
  max-width: 760px;
  margin: auto;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  padding: 28px;
  line-height: 1.85;
  overflow-wrap: anywhere;
}

#rContent p {
  margin: 0 0 1em;
}

@media (max-width: 767px) {
  .modal {
    align-items: flex-start;
    padding: 10px;
  }

  .modal-box {
    width: 100%;
    max-height: calc(100vh - 20px);
    max-height: calc(100dvh - 20px);
    padding: 16px;
    border-radius: 14px;
  }

  .detail-head {
    flex-direction: column;
    gap: 14px;
  }

  #dCover {
    width: 130px;
    max-width: 55%;
  }

  .panel {
    padding: 14px;
  }

  .reader-box {
    padding: 20px 16px;
    border-radius: 12px;
  }

  #dTitle {
    font-size: 21px !important;
  }
}

  </style>
    <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<script>
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
<body>
  <header>
    <div class="nav-top">
      <div class="logo" onclick="showView('home')"><img src="icon.png" alt="Logo BabKita" style="width:38px;height:38px;border-radius:10px;object-fit:cover;" />
      <div>Bab<span>Kita</span></div></div>
      <div class="search-box"><input type="text" id="searchInput" onkeyup="drawBooks()" placeholder="Cari judul buku atau penulis..." /></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-amber" onclick="openModal('writeModal')">+ Menulis</button>
        <button class="btn btn-dark" id="authBtn" onclick="openModal('authModal')">Masuk / Daftar</button>
      </div>
    </div>
    <div class="cat-bar"><div class="cat-inner" id="catList"></div></div>
  </header>
  <main>
    <section id="homeView">
            <div class="banner-wrap">
        <div class="banner-carousel" id="bannerCarousel">
          <div class="banner-slide" onclick="pickCat('Semua')">
            <img src="banner1.jpg.jpg" alt="Banner 1 BabKita" />
          </div>
          <div class="banner-slide" onclick="openModal('writeModal')">
            <img src="banner2.jpg.jpg" alt="Banner 2 BabKita" />
          </div>
          <div class="banner-slide" onclick="pickCat('Novel Romantis')">
            <img src="banner3.jpg.jpg" alt="Banner 3 BabKita" />
          </div>
          <div class="banner-slide" onclick="pickCat('Pengumuman')">
            <img src="banner4.jpg.jpg" alt="Banner 4 BabKita" />
          </div>
          <div class="banner-slide" onclick="pickCat('Novel Fantasi')">
            <img src="banner5.jpg.jpg" alt="Banner 5 BabKita" />
          </div>
        </div>
      </div>
    <div class="section-title" id="shelfTitle">Buku Terbaru</div>
      <div id="statusMsg" style="font-size:12px;color:#b45309;margin-bottom:12px;"></div>
      <div class="grid" id="booksGrid"></div>
<div id="categoryShelves"></div>
    </section>
    <section id="detailView" class="hidden">
      <button class="btn btn-outline" style="margin-bottom:16px;" onclick="showView('home')">Kembali ke Beranda</button>
      <div class="panel">
        <div class="detail-head">
          <img id="dCover" src="" alt="Cover" />
          <div style="flex:1;min-width:240px;">
            <span id="dCat" style="background:var(--amber-light);color:#92400e;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;"></span>
            <h1 id="dTitle" style="font-size:24px;margin:10px 0 4px;"></h1>
            <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Oleh <strong id="dAuthor"></strong></p>
            <div style="display:flex;gap:16px;background:#fffbeb;padding:12px;border-radius:12px;border:1px solid var(--border);margin-bottom:16px;font-size:13px;">
              <div>Pembaca: <strong id="dViews">0</strong></div>
              <div>Bab: <strong id="dChaps">1</strong></div>
              <div>Subscribe: <strong id="dSubs">0</strong></div>
              <div>Komentar: <strong id="dComms">0</strong></div>
            </div>
            <p id="dExcerpt" style="font-size:14px;color:#475569;line-height:1.6;margin-bottom:18px;"></p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn btn-amber" onclick="openReader(0)">Baca Bab 1</button>
              <button class="btn btn-outline" id="subBtn" onclick="toggleSub()">Subscribe</button>
              <button type="button" class="btn" style="background-color: #16a34a; color: white; border: none;" onclick="bagikanBuku()">Bagikan</button>
              <button class="btn btn-dark" onclick="openModal('chapModal')">+ Tambah Bab</button>
            </div>
          </div>
        </div>
        <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:18px;">
          <h3 style="font-size:16px;margin-bottom:12px;">Daftar Bab</h3>
          <div id="chapterList" style="display:flex;flex-direction:column;gap:8px;"></div>
        </div>
      </div>
    </section>
    </section>
    <section id="readerView" class="hidden">
      <div style="max-width:760px;margin:0 auto 14px;display:flex;justify-content:space-between;">
        <button class="btn btn-outline" onclick="showView('detail')">Detail Buku</button>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-outline" onclick="resizeFont(-1)">A-</button>
          <button class="btn btn-outline" onclick="resizeFont(1)">A+</button>
        </div>
      </div>
      <article class="reader-box">
        <div id="rCat" style="font-size:11px;font-weight:700;color:var(--amber-dark);"></div>
        <h1 id="rTitle" style="font-size:24px;margin:6px 0 20px;"></h1>
        <div id="rContent"></div>
<div style="display:flex;justify-content:space-between;margin-top:28px;padding-top:16px;border-top:1px solid var(--border);">
       <button class="btn btn-outline" id="prevChapBtn" onclick="changeChap(-1)">← Bab Sebelumnya</button>
       <button class="btn btn-amber" id="nextChapBtn" onclick="changeChap(1)">Bab Selanjutnya →</button>
     </div>
      </article>
      <div class="panel" style="max-width:760px;margin:20px auto 0;">
        <h3 style="margin-bottom:12px;font-size:16px;">Komentar Pembaca</h3>
        <div style="display:flex;gap:8px;margin-bottom:16px;">
          <input type="text" id="commInput" placeholder="Tulis komentar..." style="flex:1;padding:9px 14px;border:1px solid #cbd5e1;border-radius:99px;" />
          <button class="btn btn-amber" onclick="postComment()">Kirim</button>
        </div>
        <div id="commList" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </section>
  </main>

  <div id="writeModal" class="modal hidden">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:14px;"><h3>Terbitkan Buku Baru</h3><button onclick="closeModal('writeModal')" style="border:none;background:none;font-size:18px;cursor:pointer;">X</button></div>
      <form onsubmit="addNewBook(event)">
        <div class="form-group"><label>Judul Buku</label><input type="text" id="nTitle" required /></div>
                <div class="form-group"><label>Kategori</label>
          <select id="nCat">
            <option>Novel Romantis</option>
            <option>Novel Religi</option>
            <option>Novel Sejarah</option>
            <option>Novel Rumtang</option>
            <option>Novel Remaja</option>
            <option>Novel Fantasi</option>
            <option>Novel Action</option>
            <option>Novel Horor</option>
            <option>Cerita Anak</option>
            <option>Biografi</option>
            <option>Inspirasi</option>
            <option>Non-Fiksi</option>
            <option>Berita</option>
            <option>Pengumuman</option>
          </select>
        </div>
  <div class="form-group"><label>Penulis</label><input type="text" id="nAuthor" required /></div>
        <div class="form-group"><label>Foto Cover Buku (Opsional)</label><input type="file" id="nCoverFile" accept="image/*" /></div>
        <div class="form-group"><label>Isi Cerita (Bab 1)</label><textarea id="nContent" rows="5" required></textarea></div>
        <button type="submit" class="btn btn-amber" style="width:100%;">Terbitkan Sekarang</button>
      </form>
    </div>
  </div>

  <div id="chapModal" class="modal hidden">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;margin-bottom:14px;"><h3>Tambah Bab Baru</h3><button onclick="closeModal('chapModal')" style="border:none;background:none;font-size:18px;cursor:pointer;">X</button></div>
      <form onsubmit="addChapter(event)">
        <div class="form-group"><label>Judul Bab</label><input type="text" id="cTitle" required /></div>
        <div class="form-group"><label>Isi Cerita</label><textarea id="cContent" rows="5" required></textarea></div>
        <button type="submit" class="btn btn-amber" style="width:100%;">Simpan Bab</button>
      </form>
    </div>
  </div>
  <div id="authModal" class="modal hidden">
    <div class="modal-box" style="text-align:center;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 id="authModalTitle">Masuk ke BabKita</h3>
        <button onclick="closeModal('authModal')" style="border:none;background:none;font-size:18px;cursor:pointer;">X</button>
      </div>
      <div id="loggedOutBox">
        <p style="font-size:13px;color:#475569;margin-bottom:18px;line-height:1.5;">
          Gunakan akun Google Anda untuk masuk, menulis buku, dan menambahkan bab baru secara terverifikasi.
        </p>

  var u = "https" + "://www." + "gstatic" + ".com/firebasejs/10.12.2/";
  document.write('<scr' + 'ipt src="' + u + 'firebase-app-compat.js"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="' + u + 'firebase-firestore-compat.js"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="' + u + 'firebase-auth-compat.js"></scr' + 'ipt>');
</script>
<script src="app.js"></script>
  <script>
(function () {
  let bannerTimer = null;
  let lastTotalSlides = -1;

  function slideBanner(dir) {
    const track = document.querySelector('.banner-carousel');
    if (!track || !track.clientWidth) return;
    const total = track.querySelectorAll('.banner-slide').length;
    if (total <= 1) return;

    const idx = Math.round(track.scrollLeft / track.clientWidth);
    const next = (idx + dir + total) % total;
    track.scrollTo({ left: next * track.clientWidth, behavior: 'smooth' });
  }

  function syncBannerUI() {
    const wrap = document.querySelector('.banner-wrap');
    const track = document.querySelector('.banner-carousel');
    if (!wrap || !track) return;

    let prevBtn = wrap.querySelector('.banner-nav.prev');
    if (!prevBtn) {
      prevBtn = document.createElement('button');
      prevBtn.type = 'button';
      prevBtn.className = 'banner-nav prev';
      prevBtn.setAttribute('aria-label', 'Banner sebelumnya');
      prevBtn.innerHTML = '&#10094;';
      prevBtn.onclick = () => slideBanner(-1);
      wrap.appendChild(prevBtn);
    }

    let nextBtn = wrap.querySelector('.banner-nav.next');
    if (!nextBtn) {
      nextBtn = document.createElement('button');
      nextBtn.type = 'button';
      nextBtn.className = 'banner-nav next';
      nextBtn.setAttribute('aria-label', 'Banner berikutnya');
      nextBtn.innerHTML = '&#10095;';
      nextBtn.onclick = () => slideBanner(1);
      wrap.appendChild(nextBtn);
    }

    let dotsBox = wrap.querySelector('#bannerDots');
    let dotsCreated = false;
    if (!dotsBox) {
      dotsBox = document.createElement('div');
      dotsBox.id = 'bannerDots';
      dotsBox.className = 'banner-dots';
      wrap.appendChild(dotsBox);
      dotsCreated = true;
    }

    const total = track.querySelectorAll('.banner-slide').length;

    // Pasang listener scroll sekali saja per elemen track
    if (!track.dataset.bannerBound) {
      track.dataset.bannerBound = '1';
      track.addEventListener('scroll', () => {
        if (!track.clientWidth) return;
        const idx = Math.round(track.scrollLeft / track.clientWidth);
        dotsBox.querySelectorAll('.banner-dot').forEach((d, i) => {
          d.classList.toggle('active', i === idx);
        });
      });
    }

    if (!dotsCreated && total === lastTotalSlides) return;
    lastTotalSlides = total;

    if (total <= 1) {
      dotsBox.innerHTML = '';
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      clearInterval(bannerTimer);
      return;
    }

    prevBtn.style.display = '';
    nextBtn.style.display = '';

    dotsBox.innerHTML = '';
    for (let i = 0; i < total; i++) {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'banner-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Banner ' + (i + 1));
      dot.onclick = () => {
        track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
      };
      dotsBox.appendChild(dot);
    }

    clearInterval(bannerTimer);
    bannerTimer = setInterval(() => slideBanner(1), 5000);
  }

  document.addEventListener('DOMContentLoaded', () => {
    syncBannerUI();
    const observer = new MutationObserver(() => syncBannerUI());
    observer.observe(document.body, { childList: true, subtree: true });
  });
})();
</script>
